      Calypso platform. It delivers real-time market data, trade entry, order
      management, risk monitoring, P&L, scenario analysis, and portfolio
      analytics for capital markets users. It surfaces capabilities from the
      underlying Calypso platform rather than being exposed as a standalone
      public API; system-to-system integration is typically performed through
      Calypso's core platform interfaces.
