description: >-
  Nasdaq Calypso Workstation is the user-facing desktop component of the Nasdaq
  Calypso (formerly Adenza / Calypso Technology) capital markets platform. It
  gives capital markets professionals access to market data, trading operations,
  risk management, and portfolio analytics across asset classes. The Workstation
  is an integrated client application rather than a publicly documented REST
  API; programmatic integration is delivered through the broader Calypso
  platform interfaces used by banks, asset managers, central banks, and
  clearing houses.
